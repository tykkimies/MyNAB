name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base-path: ["", "/mynab"]
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: mynab
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: mynab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mynab -d mynab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://mynab:ci-synthetic-only@127.0.0.1:5432/mynab_test
      SECRET_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      APP_ORIGIN: https://127.0.0.1:3443
      APP_BASE_PATH: ${{ matrix.base-path }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Container build
        run: docker build --build-arg APP_BASE_PATH="$APP_BASE_PATH" --target runner -t mynab:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
