# Alternative to the NPM Custom locations UI: paste into the EXISTING host's
# Advanced tab. Do not define the same location in both places.
location = /mynab {
    return 302 /mynab/budget;
}
location ^~ /mynab/ {
    # No trailing slash or rewrite: preserve the /mynab prefix upstream.
    proxy_pass http://192.168.1.7:3107;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 16k;
    proxy_read_timeout 60s;
}
