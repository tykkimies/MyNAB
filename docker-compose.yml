name: mynab
x-app-env: &app-env
  NODE_ENV: production
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY in .env}
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mynab}
      POSTGRES_DB: ${POSTGRES_DB:-mynab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options: { max-size: 10m, max-file: "3" }
  migrate:
    build: { context: ., target: tools }
    environment: *app-env
    command: [npm, run, db:migrate]
    networks: [database]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks: [database, frontend]
    depends_on:
      migrate: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      options: { max-size: 10m, max-file: "3" }
networks:
  database:
    internal: true
  frontend: {}
volumes:
  postgres-data: {}
