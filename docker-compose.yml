name: mynab
x-app-env: &app-env
  NODE_ENV: production
  APP_BASE_PATH: ${APP_BASE_PATH:-}
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY in .env}
  SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
  # SimpleFIN Bridge bank sync (about $15/year for up to 25 banks). Needs no
  # server secret: connections are added by pasting a setup token on Bank sync.
  # Set to off to hide it and stop its syncs.
  SIMPLEFIN: ${SIMPLEFIN:-on}
  # Optional phone push for debt reminders (https://ntfy.sh or self-hosted).
  # Off while NTFY_TOPIC is empty. On a public server the topic is the only
  # secret: use a long random one, or a token. NTFY_DETAIL=full adds amounts.
  NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
  NTFY_TOPIC: ${NTFY_TOPIC:-}
  NTFY_TOKEN: ${NTFY_TOKEN:-}
  NTFY_DETAIL: ${NTFY_DETAIL:-minimal}
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mynab}
      POSTGRES_DB: ${POSTGRES_DB:-mynab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options: { max-size: 10m, max-file: "3" }
  migrate:
    build:
      context: .
      target: tools
      args: { APP_BASE_PATH: "${APP_BASE_PATH:-}" }
    environment: *app-env
    command: [npm, run, db:migrate]
    networks: [database]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  app:
    build:
      context: .
      target: runner
      args: { APP_BASE_PATH: "${APP_BASE_PATH:-}" }
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks: [database, frontend]
    depends_on:
      migrate: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      options: { max-size: 10m, max-file: "3" }
  worker:
    build:
      context: .
      target: tools
      args: { APP_BASE_PATH: "${APP_BASE_PATH:-}" }
    restart: unless-stopped
    environment: *app-env
    command: [npm, run, worker]
    stop_grace_period: 60s
    networks: [database, frontend]
    depends_on:
      migrate: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      # The worker touches this file every loop; a long sync may take minutes.
      test:
        [
          CMD,
          node,
          -e,
          "process.exit(Date.now()-require('fs').statSync('/tmp/mynab-worker-heartbeat').mtimeMs<600000?0:1)",
        ]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      options: { max-size: 10m, max-file: "3" }
networks:
  database:
    internal: true
  frontend: {}
volumes:
  postgres-data: {}
